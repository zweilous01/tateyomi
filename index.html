    return;
  }
  sheetEl.innerHTML=head('写真',l.locked?'ロック中':'')+`<p class="note">ドラッグで移動。右下の丸で、切り取った形のまま大きさを変えられます。</p>
  <div class="row"><button class="chip go" id="iCrop" ${l.locked?'disabled':''}>切り取り</button><button class="chip" id="iFrame" aria-pressed="${pr(l.frame)}">コマ枠</button><button class="chip" id="iFlip" aria-pressed="${pr(l.flip)}">左右反転</button><button class="chip" id="iFull">横幅いっぱい</button><button class="chip" id="iRatio">切り取りを元に戻す</button></div>
  ${rotHTML(l)}
  <div class="row"><button class="chip" id="oDup">${ic('copy')}複製</button><button class="chip danger" id="oDel">${ic('trash')}削除</button></div>`;
  $('#iCrop',sheetEl).onclick=startCrop;
  $('#iFrame',sheetEl).onclick=()=>objEdit(x=>x.frame=!x.frame);$('#iFlip',sheetEl).onclick=()=>objEdit(x=>x.flip=!x.flip);
  $('#iFull',sheetEl).onclick=()=>objEdit(x=>{scaleImage(x,PW/x.w);x.x=0;},false);
  $('#iRatio',sheetEl).onclick=()=>objEdit(x=>{const I=imgPage(x),cx=x.x+x.w/2,cy=x.y+x.h/2,w=I.w,h=I.h;x.x=cx-w/2;x.y=cy-h/2;x.w=w;x.h=h;x.cr={x:0,y:0,w,h};},false);
  wireRot(l);
  $('#oDup',sheetEl).onclick=dupLayer;twoTap($('#oDel',sheetEl),delLayer,'もう一度で削除');
}
/* ================= レイヤーの帯 ================= */
let railOpen=true,railQ=0;
try{railOpen=localStorage.getItem('tyk-rail')!=='0';}catch(e){}
function railSoon(){if(railQ)return;railQ=requestAnimationFrame(()=>{railQ=0;renderRail();});}
function setRail(o){railOpen=o;try{localStorage.setItem('tyk-rail',o?'1':'0');}catch(e){}renderRail();}
function renderRail(){
  const rail=$('#rail'),tab=$('#railTab'),p=cur.page;
  const ro=railOpen&&!!work,rs=!railOpen&&!!work,bc=document.body.classList;if(bc.contains('rail-open')!==ro||bc.contains('rail-shut')!==rs){bc.toggle('rail-open',ro);bc.toggle('rail-shut',rs);applyZoom();}
  rail.hidden=!railOpen||!work||!p;tab.hidden=railOpen||!work||!p;
  if(!work||!p)return;
  if(!railOpen){tab.innerHTML=ic('layers')+p.layers.length;return;}
  const list=$('#rlist');list.innerHTML='';
  p.layers.slice().reverse().forEach(x=>{
    const b=document.createElement('div');b.className='ritem'+(x.visible?'':' off');b.setAttribute('role','button');b.setAttribute('aria-selected',pr(x===cur.layer));b.setAttribute('aria-label',(x.name||typeLabel(x))+'（長押しで詳細）');
    b.appendChild(layerThumb(x));
    b.insertAdjacentHTML('beforeend',`<span class="rtype">${typeLabel(x)}</span>${x.locked?`<span class="rlock">${ic('lock')}</span>`:''}<button class="reye" aria-label="表示の切り替え">${ic(x.visible?'eye':'eyeoff')}</button>`);
    let t=0,long=false,sx=0,sy=0;
    b.onpointerdown=e=>{if(e.target.closest('.reye'))return;long=false;sx=e.clientX;sy=e.clientY;clearTimeout(t);t=setTimeout(()=>{long=true;pick(x);sheet='layers';renderSheet();},480);};
    b.onpointermove=e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(t);};
    b.onpointerup=b.onpointercancel=()=>clearTimeout(t);
    b.oncontextmenu=e=>e.preventDefault();
    b.onclick=e=>{if(e.target.closest('.reye')||long)return;pick(x);};
    $('.reye',b).onclick=e=>{e.stopPropagation();pushStruct(p);x.visible=!x.visible;paintLayer(x);updSel();markDirty();if(sheet==='layers')renderSheet();};
    list.appendChild(b);
  });
  const sel=$('.ritem[aria-selected="true"]',list);if(sel)sel.scrollIntoView({block:'nearest'});
  function pick(x){cur.layer=x;objSel=x.type!=='raster'&&tool==='move';updSel();if(sheet==='layers'||sheet==='tool')renderSheet();}
}
$('#railClose').onclick=()=>setRail(false);
$('#railTab').onclick=()=>setRail(true);
$('#railAdd').onclick=()=>{const p=cur.page;if(!p)return;pushStruct(p);const nl=rasterLayer(p);insertAbove(p,nl);objSel=false;syncLayers(p);updSel();markDirty();if(sheet==='layers')renderSheet();toast(`「${nl.name}」を追加しました`);};
$('#railMore').onclick=()=>{sheet=sheet==='layers'?null:'layers';renderSheet();};

function layerThumb(l){const c=newCanvas(64,90),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,64,90);g.setTransform(64/PW,0,0,90/PH,0,0);try{drawLayerTo(g,l);}catch(e){}return c;}
function layerSheet(){
  const p=cur.page,l=cur.layer,n=work.pages.indexOf(p)+1;
  const rows=p.layers.slice().reverse().map(x=>`<div class="lyrow${x.visible?'':' off'}" data-id="${x.id}" aria-selected="${pr(x===l)}"><button class="ib" data-v="${x.id}" aria-label="表示の切り替え">${ic(x.visible?'eye':'eyeoff')}</button><span class="lthumb" data-t="${x.id}"></span><span class="lname"><b>${esc(x.name||typeLabel(x))}</b><small>${typeLabel(x)}・${BLENDS.find(b=>b[0]===x.blend)?.[1]||'通常'}・${Math.round(x.opacity*100)}%</small></span><button class="ib" data-k="${x.id}" aria-label="ロックの切り替え">${ic(x.locked?'lock':'unlock')}</button></div>`).join('');
  const bgc=p.bg||'#ffffff';
  sheetEl.innerHTML=head('レイヤー',`${n}ページ目`)+`<div class="row"><span class="lbl">用紙の色</span>${BGS.map(c=>`<button class="sw" data-bg="${c}" style="background:${c}" aria-label="用紙の色 ${c}" aria-pressed="${pr(bgc===c)}"></button>`).join('')}<label class="sw custom" aria-label="用紙の色を自由に選ぶ"><span style="background:${bgc}"></span><input type="color" id="bgPick" value="${bgc}"></label></div>
  <div class="row"><button class="chip" id="lAdd">${ic('plus')}絵レイヤー</button><button class="chip" id="lDup" ${l?'':'disabled'}>${ic('copy')}複製</button><button class="chip" id="lUp" ${l?'':'disabled'}>${ic('up')}上へ</button><button class="chip" id="lDown" ${l?'':'disabled'}>${ic('down')}下へ</button><button class="chip" id="lMerge" ${l?'':'disabled'}>${ic('merge')}下と結合</button><button class="chip danger" id="lDel" ${l?'':'disabled'}>${ic('trash')}削除</button></div>
  <div class="lylist">${rows||'<div class="empty">レイヤーがありません</div>'}</div>
  ${l?`<div class="row"><label class="lbl" for="lName">名前</label><input class="tin" id="lName" style="flex:1;width:auto" value="${esc(l.name)}"></div>${slider('lOp','不透明度',0,100,1,Math.round(l.opacity*100),v=>v+'%')}<div class="row"><span class="lbl">合成</span>${chips('blend',BLENDS,l.blend)}</div>`:''}`;
  const setBg=c=>{pushStruct(p);p.bg=c;syncLayers(p);markDirty();renderSheet();};
  $$('[data-bg]',sheetEl).forEach(b=>b.onclick=()=>setBg(b.dataset.bg));$('#bgPick',sheetEl).onchange=e=>setBg(e.target.value);
  $$('[data-t]',sheetEl).forEach(s=>{const x=p.layers.find(y=>y.id===s.dataset.t);if(x)s.appendChild(layerThumb(x));});
  $$('.lyrow',sheetEl).forEach(r=>r.onclick=()=>{cur.layer=p.layers.find(x=>x.id===r.dataset.id);objSel=cur.layer.type!=='raster'&&tool==='move';updSel();renderSheet();});
  $$('[data-v]',sheetEl).forEach(b=>b.onclick=e=>{e.stopPropagation();const x=p.layers.find(y=>y.id===b.dataset.v);pushStruct(p);x.visible=!x.visible;paintLayer(x);updSel();markDirty();renderSheet();});
  $$('[data-k]',sheetEl).forEach(b=>b.onclick=e=>{e.stopPropagation();const x=p.layers.find(y=>y.id===b.dataset.k);x.locked=!x.locked;paintLayer(x);updSel();markDirty();renderSheet();});
  $('#lAdd',sheetEl).onclick=()=>{pushStruct(p);const nl=rasterLayer(p);insertAbove(p,nl);objSel=false;syncLayers(p);updSel();markDirty();renderSheet();};
  if(!l)return;
  $('#lDup',sheetEl).onclick=dupLayer;
  const mv=d=>{const i=p.layers.indexOf(l),j=i+d;if(j<0||j>=p.layers.length)return;pushStruct(p);p.layers.splice(i,1);p.layers.splice(j,0,l);syncLayers(p);markDirty();renderSheet();};
  $('#lUp',sheetEl).onclick=()=>mv(1);$('#lDown',sheetEl).onclick=()=>mv(-1);
  $('#lMerge',sheetEl).onclick=mergeDown;twoTap($('#lDel',sheetEl),delLayer,'もう一度で削除');
  const nm=$('#lName',sheetEl);nm.onchange=()=>{pushStruct(p);l.name=nm.value.trim()||typeLabel(l);markDirty();renderSheet();};
  wireSlider('lOp',v=>v+'%',v=>{l.opacity=v/100;paintLayer(l);markDirty();},()=>pushStruct(p));
  wireChips('blend',v=>{pushStruct(p);l.blend=v;paintLayer(l);markDirty();renderSheet();});
}
function mergeDown(){
  const p=cur.page,l=cur.layer,i=p.layers.indexOf(l);if(i<1){toast('下にレイヤーがありません');return;}
  const below=p.layers[i-1];pushStruct(p);const c=newRaster(),g=c.getContext('2d');g.setTransform(DR,0,0,DR,0,0);
  if(below.visible)drawLayerTo(g,below);if(l.visible){g.globalAlpha=l.opacity;g.globalCompositeOperation=l.blend==='normal'?'source-over':l.blend;drawLayerTo(g,l);}
  const nl=mkLayer('raster',{name:below.name||'絵',opacity:below.opacity,blend:below.blend,locked:false});nl.canvas=c;nl.ver=1;nl.savedVer=0;nl.key=null;
  p.layers.splice(i-1,2,nl);cur.layer=nl;objSel=false;syncLayers(p);updSel();markDirty();renderSheet();toast('下のレイヤーと結合しました');
}
function materialSheet(){
  const n=work.pages.indexOf(cur.page)+1;
  const kp=rows=>`<span class="kp">${komaRects(rows).map(r=>`<i style="left:${r.x/PW*100}%;top:${r.y/PH*100}%;width:${r.w/PW*100}%;height:${r.h/PH*100}%"></i>`).join('')}</span>`;
  sheetEl.innerHTML=head('素材（仮）',`${n}ページ目に新しいレイヤーで追加`)+`<div class="sub">コマ割り</div><div class="row">${KOMA.map(([k,name,rows])=>`<button class="chip kchip" data-koma="${k}">${kp(rows)}${name}</button>`).join('')}</div>
  <div class="sub">効果線</div><div class="row"><button class="chip" data-fx="focus1">集中線（弱）</button><button class="chip" data-fx="focus2">集中線（強）</button><button class="chip" data-fx="speed">スピード線</button></div>
  <p class="note">追加した線は普通の絵レイヤーなので、消しゴムで削ったり、塗りつぶしの境目に使えます。</p>`;
  wireChips('koma',k=>genKoma(KOMA.find(x=>x[0]===k)[2]));
  wireChips('fx',v=>v==='speed'?genSpeed():genFocus(v==='focus2'));
}
function photoSheet(){
  const list=visiblePhotos(),al=allAlbums();
  const albumChips=[['all','すべて'],['none','未分類'],...al.map(a=>[a,a])];
  sheetEl.innerHTML=head('写真',Store.mode==='cloud'?'アカウントに保存':'')+`<div class="row"><button class="chip go" id="phPick">＋ 写真を選ぶ</button><button class="chip" id="phOrg" aria-pressed="${pr(orgMode)}">整理する</button></div>
  <div class="row">${albumChips.map(([v,n])=>`<button class="chip" data-alb="${esc(v)}" aria-pressed="${pr(albumFilter===v)}">${esc(n)}</button>`).join('')}<button class="chip" id="albAdd">${ic('plus')}アルバム</button></div>
  <div class="row" id="albNewRow" hidden><input class="tin" id="albNew" style="flex:1;width:auto" placeholder="アルバムの名前" maxlength="20"><button class="chip go" id="albOk">作る</button></div>
  <div class="strip" id="thumbs"></div>
  ${orgMode?`<div class="row"><span class="lbl">${picked.size}枚選択中</span><button class="chip" id="pkAll">全部選ぶ</button><button class="chip" id="pkNone">選択を外す</button></div>
   <div class="row"><span class="lbl">移動先</span>${[['','未分類'],...al.map(a=>[a,a])].map(([v,n])=>`<button class="chip" data-mv="${esc(v)}" ${picked.size?'':'disabled'}>${esc(n)}</button>`).join('')}</div>
   <div class="row"><button class="chip danger" id="pkDel" ${picked.size?'':'disabled'}>${ic('trash')}選んだ写真を削除</button></div>`
   :`<p class="note">写真を上にスワイプすると、指を離したページに貼れます。タップすると今のページの真ん中に貼ります。</p>`}`;
  const t=$('#thumbs',sheetEl);
  if(!list.length)t.innerHTML=`<div class="empty">${photos.length?'このアルバムには写真がありません':'「＋ 写真を選ぶ」でスマホの写真を何枚でも読み込めます。読み込んだ写真はここに残り、いつでも使えます'}</div>`;
  list.forEach(ph=>{const b=document.createElement('button');b.type='button';b.className='thumb'+(picked.has(ph.id)?' picked':'');b.setAttribute('aria-label',orgMode?'選ぶ':'この写真を貼る');
    const im=document.createElement('img');im.alt='';im.loading='lazy';im.draggable=false;Store.getUrl(ph.key).then(u=>{if(u)im.src=u;});b.appendChild(im);attachThumb(b,ph);t.appendChild(b);});
  $('#phPick',sheetEl).onclick=()=>fileIn.click();
  $('#phOrg',sheetEl).onclick=()=>{orgMode=!orgMode;picked.clear();renderSheet();};
  wireChips('alb',v=>{albumFilter=v;renderSheet();});
  $('#albAdd',sheetEl).onclick=()=>{$('#albNewRow',sheetEl).hidden=false;$('#albNew',sheetEl).focus();};
  $('#albOk',sheetEl).onclick=async()=>{const v=$('#albNew',sheetEl).value.trim();if(!v)return;if(!albums.includes(v))albums.push(v);try{await Store.setDoc('meta','albums',{names:albums});}catch(e){}albumFilter=v;renderSheet();};
  if(orgMode){$('#pkAll',sheetEl).onclick=()=>{list.forEach(p=>picked.add(p.id));renderSheet();};$('#pkNone',sheetEl).onclick=()=>{picked.clear();renderSheet();};
    wireChips('mv',v=>movePicked(v));if(picked.size)twoTap($('#pkDel',sheetEl),deletePicked,'もう一度押すと削除');}
}
function exportSheet(){
  const n=work.pages.indexOf(cur.page)+1;
  sheetEl.innerHTML=head('書き出し','PNG画像で保存')+`<div class="row"><button class="chip go" data-ex="one">${n}ページ目だけ</button><button class="chip" data-ex="long">全ページを縦につなげて1枚</button><button class="chip" data-ex="each">全ページを1枚ずつ</button></div>
  <p class="note">保存するときに確認が出ます。「1枚ずつ」はページの数だけ確認が出ます。作品そのものは自動で保存されているので、書き出しは投稿用の画像を作るときだけで大丈夫です。</p>`;
  wireChips('ex',m=>exportPages(m));
}

/* ================= 起動 ================= */
(async()=>{
  $('#boot').textContent='保存場所に接続しています…';
  await Store.init();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  Promise.all(FONTS.map(f=>document.fonts.load(`${f.w} 24px ${f.fam}`,'あア字!').catch(()=>{}))).then(()=>{if(work)work.pages.forEach(p=>p.layers.forEach(l=>{if(l.type==='text')paintLayer(l);}));updSel();});
  await loadLibrary();
  let list=[];try{list=await Store.listDocs('works');}catch(e){}
  $('#boot').hidden=true;
  if(!list.length)startWork(true);else showGallery();
})();
document.fonts.addEventListener?.('loadingdone',()=>{if(work)work.pages.forEach(p=>p.layers.forEach(l=>{if(l.type==='text')paintLayer(l);}));updSel();});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
